server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  location = /tools {
    return 308 /archive#tools;
  }

  location = /projects/transcript-create {
    return 308 /projects/hasanara;
  }

  location ~* "^/assets/.*-[A-Za-z0-9_-]{8,}\.(css|js|woff2)$" {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* ^/assets/(?:projects|social)/ {
    try_files $uri =404;
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    try_files $uri/index.html $uri =404;
  }
}
