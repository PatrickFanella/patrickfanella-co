name: Verification

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify API
        run: cd api && go test ./...
      - name: Prepare representative environment
        run: cp .env.example .env
      - name: Install web dependencies
        run: cd web && npm ci
      - name: Verify web
        run: cd web && npm run lint && npm run test && npm run build
      - name: Install Chromium
        run: cd web && npx playwright install --with-deps chromium
      - name: Share the job network with test containers
        # Containers started through the mounted Docker socket run beside this
        # job container, and their published ports land on the Docker host,
        # which this container may not be able to reach. Joining the job
        # container's network namespace exposes them on localhost instead.
        run: |
          job_container=$(hostname)
          if docker inspect --format '{{.Id}}' "$job_container" >/dev/null 2>&1; then
            echo "E2E_DOCKER_NETWORK=container:$job_container" >> "$GITHUB_ENV"
            echo "E2E_RUN_ID=$job_container" >> "$GITHUB_ENV"
            echo "Test containers will join job container $job_container"
          else
            echo "Not running in a Docker job container; test containers publish host ports"
          fi
      - name: Production-shaped browser tests
        run: cd web && npm run test:e2e
      - name: Mobile Lighthouse budgets
        # Lighthouse CI needs a Chrome binary; reuse the Chromium Playwright installed.
        run: |
          cd web
          CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          export CHROME_PATH
          npm run lighthouse:ci
      - name: Remove test containers
        # Playwright and Lighthouse CI can stop their server commands before
        # the scripts' cleanup traps run, and containers sharing the job's
        # network namespace outlive the job container. Remove this run's
        # containers and image tags explicitly.
        if: always() && env.E2E_RUN_ID != ''
        run: |
          filter="name=patrickfanella-portfolio-.*-${E2E_RUN_ID}$"
          # A container started with --rm may already be removing itself.
          docker ps -aq --filter "$filter" | xargs -r docker rm -f || true
          for _ in 1 2 3 4 5; do
            [ -z "$(docker ps -aq --filter "$filter")" ] && break
            sleep 2
          done
          leftover=$(docker ps -a --filter "$filter" --format '{{.Names}}')
          if [ -n "$leftover" ]; then
            echo "Test containers still present: $leftover" >&2
            exit 1
          fi
          for repo in patrickfanella-portfolio-e2e patrickfanella-portfolio-lighthouse; do
            docker image rm "${repo}:${E2E_RUN_ID}" >/dev/null 2>&1 || true
          done

  frontend:
    name: Build frontend and deploy NUC
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Reuse an already accepted frontend artifact
        id: artifact
        if: github.server_url == 'https://git.subcult.tv' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh_args=(-F /dev/null -i "$deploy_dir/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts"
            -o ConnectTimeout=15 onnwee@10.0.0.56)
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION web" > "$deploy_dir/artifact.json"
          python3 - "$deploy_dir/artifact.json" "$GITHUB_OUTPUT" <<'PYCODE'
          import json, re, sys
          from pathlib import Path
          info = json.loads(Path(sys.argv[1]).read_text())
          available = info.get("available") is True
          if available:
              assert re.fullmatch(r"[0-9a-f]{64}", info.get("html_sha256", ""))
          with Path(sys.argv[2]).open("a") as output:
              output.write("available=" + str(available).lower() + "\n")
          PYCODE
      - name: Build deployable images from the verified revision
        if: steps.artifact.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          image="fleet-deploy/patrickfanella-co/web:$DEPLOY_REVISION"
          docker build --build-arg VITE_SITE_URL=https://patrickfanella.co --build-arg VITE_API_BASE_URL= --build-arg VITE_ANALYTICS_PLAUSIBLE_DOMAIN= -f web/Dockerfile --label "org.opencontainers.image.revision=$DEPLOY_REVISION" \
            --label "org.opencontainers.image.source=https://git.subcult.tv/PatrickFanella/patrickfanella-co" -t "$image" .
          docker run --rm --network none --add-host api:127.0.0.1 --entrypoint nginx "$image" -t
      - name: Deploy the built image and verify public HTML
        if: >-
          github.server_url == 'https://git.subcult.tv' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          REUSE_ARTIFACT: ${{ steps.artifact.outputs.available }}
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh_args=(-F /dev/null -i "$deploy_dir/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts"
            -o ConnectTimeout=15 onnwee@10.0.0.56)
          ssh "${ssh_args[@]}" status
          image="fleet-deploy/patrickfanella-co/web:$DEPLOY_REVISION"
          # The forced receiver accepts a full hexadecimal revision; expand it here.
          if [[ "$REUSE_ARTIFACT" != true ]]; then
            # shellcheck disable=SC2029
            docker save "$image" | ssh "${ssh_args[@]}" "receive $DEPLOY_REVISION web"
          fi
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "deploy $DEPLOY_REVISION"
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION web" > "$deploy_dir/artifact.json"
          expected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["html_sha256"])' "$deploy_dir/artifact.json")
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            --max-time 30 https://patrickfanella.co/ > "$deploy_dir/live.html"
          actual=$(sha256sum "$deploy_dir/live.html" | cut -d' ' -f1)
          test "$actual" = "$expected"
          printf 'Live HTML matches the image built from %s\n' "$DEPLOY_REVISION"
