name: Verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify API
        run: cd api && go test ./...
      - name: Prepare representative environment
        run: cp .env.example .env
      - name: Install web dependencies
        run: cd web && npm ci
      - name: Verify web
        run: cd web && npm run lint && npm run test && npm run build
      - name: Install Chromium
        run: cd web && npx playwright install --with-deps chromium
      - name: Share the job network with test containers
        # Containers started through the mounted Docker socket run beside this
        # job container, and their published ports land on the Docker host,
        # which this container may not be able to reach. Joining the job
        # container's network namespace exposes them on localhost instead.
        run: |
          job_container=$(hostname)
          if docker inspect --format '{{.Id}}' "$job_container" >/dev/null 2>&1; then
            echo "E2E_DOCKER_NETWORK=container:$job_container" >> "$GITHUB_ENV"
            echo "E2E_RUN_ID=$job_container" >> "$GITHUB_ENV"
            echo "Test containers will join job container $job_container"
          else
            echo "Not running in a Docker job container; test containers publish host ports"
          fi
      - name: Production-shaped browser tests
        run: cd web && npm run test:e2e
      - name: Mobile Lighthouse budgets
        run: cd web && npm run lighthouse:ci
