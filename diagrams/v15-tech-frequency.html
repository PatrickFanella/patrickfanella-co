<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portfolio — Technology Frequency</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1b26;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px;font-family:'Space Grotesk',sans-serif}.card{background:#282a36;padding:28px 24px;max-width:760px;width:100%;box-shadow:6px 6px 0 #f8f8f2;color:#f8f8f2}</style>
</head>
<body>
<div class="card">
<div style="font-size:16px;font-weight:500;margin-bottom:4px;font-family:'JetBrains Mono',monospace;color:#ff79c6;">Technology frequency</div>
<div style="font-size:12px;color:#6272a4;margin-bottom:20px;font-family:'JetBrains Mono',monospace;">How often each technology appears across 13 projects (bubble size = project count)</div>
<div style="position:relative;height:440px;"><canvas id="c"></canvas></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
Chart.defaults.color='#6272a4';Chart.defaults.font.family='"JetBrains Mono",monospace';Chart.defaults.font.size=11;

// x = category (0=lang, 1=framework, 2=data, 3=infra, 4=testing)
// y = project count, r = scaled
const data = [
  // Languages
  {x:0, y:10, r:20, label:'TypeScript', bg:'#bd93f9'},
  {x:0, y:4,  r:14, label:'Go', bg:'#8be9fd'},
  {x:0, y:3,  r:12, label:'Python', bg:'#ff79c6'},
  {x:0, y:10, r:20, label:'SQL', bg:'#50fa7b'},
  {x:0, y:1,  r:7,  label:'Solidity', bg:'#f1fa8c'},
  // Frameworks
  {x:1, y:10, r:20, label:'React', bg:'#bd93f9'},
  {x:1, y:7,  r:16, label:'Vite', bg:'#8be9fd'},
  {x:1, y:7,  r:16, label:'Tailwind', bg:'#8be9fd'},
  {x:1, y:3,  r:12, label:'Next.js', bg:'#f8f8f2'},
  {x:1, y:2,  r:9,  label:'FastAPI', bg:'#ff79c6'},
  {x:1, y:4,  r:14, label:'Express', bg:'#ffb86c'},
  {x:1, y:2,  r:9,  label:'Gin', bg:'#50fa7b'},
  // Data
  {x:2, y:10, r:20, label:'PostgreSQL', bg:'#50fa7b'},
  {x:2, y:4,  r:14, label:'Redis', bg:'#ff5555'},
  {x:2, y:2,  r:9,  label:'OpenSearch', bg:'#bd93f9'},
  {x:2, y:2,  r:9,  label:'Prisma', bg:'#8be9fd'},
  // Infra
  {x:3, y:11, r:20, label:'Docker', bg:'#8be9fd'},
  {x:3, y:10, r:20, label:'GitHub Actions', bg:'#f8f8f2'},
  {x:3, y:3,  r:12, label:'K8s', bg:'#bd93f9'},
  {x:3, y:2,  r:9,  label:'Terraform', bg:'#ffb86c'},
  {x:3, y:3,  r:12, label:'Prometheus', bg:'#f1fa8c'},
  // Testing
  {x:4, y:6,  r:16, label:'Playwright', bg:'#ff79c6'},
  {x:4, y:4,  r:14, label:'Vitest/Jest', bg:'#ffb86c'},
  {x:4, y:3,  r:12, label:'Go testing', bg:'#8be9fd'},
  {x:4, y:3,  r:12, label:'pytest', bg:'#ff79c6'},
];

new Chart(document.getElementById('c'),{type:'bubble',
  data:{datasets: data.map(d=>({
    label: d.label,
    data: [{x: d.x + (Math.random()*0.6-0.3), y: d.y + (Math.random()*0.4-0.2), r: d.r}],
    backgroundColor: d.bg + '88',
    borderColor: d.bg,
    borderWidth: 2,
  }))},
  options:{
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{display:false},
      tooltip:{callbacks:{
        title: ctx => ctx[0].dataset.label,
        label: ctx => Math.round(ctx.raw.y) + ' projects'
      }}
    },
    scales:{
      x:{
        min:-0.5, max:4.5,
        grid:{color:'rgba(98,114,164,0.15)'},
        ticks:{
          callback: v => ['Languages','Frameworks','Data','Infra','Testing'][Math.round(v)] || '',
          autoSkip:false,
          maxRotation:0
        }
      },
      y:{
        min:0, max:12,
        grid:{color:'rgba(98,114,164,0.15)'},
        title:{display:true, text:'Projects using this', color:'#6272a4', font:{size:11}},
        ticks:{stepSize:2}
      }
    }
  }
});
</script>
</body></html>
