<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portfolio — Engineering Maturity</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1b26;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px;font-family:'Space Grotesk',sans-serif}.card{background:#282a36;padding:28px 24px;max-width:760px;width:100%;box-shadow:6px 6px 0 #f8f8f2;color:#f8f8f2}</style>
</head>
<body>
<div class="card">
<div style="font-size:16px;font-weight:500;margin-bottom:4px;font-family:'JetBrains Mono',monospace;color:#50fa7b;">Engineering maturity</div>
<div style="font-size:12px;color:#6272a4;margin-bottom:12px;font-family:'JetBrains Mono',monospace;">Test files · CI workflows · Dockerfiles · Documentation pages</div>
<div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;font-size:11px;color:#6272a4;font-family:'JetBrains Mono',monospace;">
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;background:#ff79c6;"></span>Test files</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;background:#8be9fd;"></span>CI workflows</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;background:#ffb86c;"></span>Dockerfiles</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;background:#50fa7b;"></span>Doc pages</span>
</div>
<div style="position:relative;height:420px;"><canvas id="c"></canvas></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
Chart.defaults.color='#6272a4';Chart.defaults.font.family='"JetBrains Mono",monospace';Chart.defaults.font.size=11;
const labels=['CLPR','Subcults','Transcript','Clustr','SoundHash','Patchwork','Discord Spy','Internet-ID','Cutroom','JuryRigged','Galdr','SubCorp'];
new Chart(document.getElementById('c'),{type:'bar',
  data:{labels,datasets:[
    {label:'Test files',data:[302,244,80,98,73,110,80,48,30,31,14,0],backgroundColor:'#ff79c6',borderRadius:0},
    {label:'CI workflows',data:[13,31,42,7,37,1,40,10,3,4,3,0],backgroundColor:'#8be9fd',borderRadius:0},
    {label:'Dockerfiles',data:[3,3,3,5,4,1,5,2,0,1,2,2],backgroundColor:'#ffb86c',borderRadius:0},
    {label:'Doc pages',data:[340,22,96,103,101,1,24,25,2,3,8,40],backgroundColor:'#50fa7b',borderRadius:0},
  ]},
  options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{x:{grid:{display:false},ticks:{maxRotation:45,autoSkip:false}},y:{stacked:false,grid:{color:'rgba(98,114,164,0.2)'},beginAtZero:true}}}
});
</script>
</body></html>
