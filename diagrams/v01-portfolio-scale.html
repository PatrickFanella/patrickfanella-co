<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portfolio — Codebase Scale</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1b26;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px;font-family:'Space Grotesk',sans-serif}.card{background:#282a36;padding:28px 24px;max-width:760px;width:100%;box-shadow:6px 6px 0 #f8f8f2;color:#f8f8f2}</style>
</head>
<body>
<div class="card">
<div style="font-size:16px;font-weight:500;margin-bottom:4px;font-family:'JetBrains Mono',monospace;color:#bd93f9;">Portfolio at a glance</div>
<div style="font-size:12px;color:#6272a4;margin-bottom:20px;font-family:'JetBrains Mono',monospace;">13 repositories · 886k+ lines of code</div>
<div style="position:relative;height:420px;"><canvas id="c"></canvas></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const D={bg:'#282a36',comment:'#6272a4',cyan:'#8be9fd',green:'#50fa7b',orange:'#ffb86c',pink:'#ff79c6',purple:'#bd93f9',red:'#ff5555',yellow:'#f1fa8c'};
Chart.defaults.color=D.comment;Chart.defaults.font.family='"JetBrains Mono",monospace';Chart.defaults.font.size=11;
const labels=['CLPR','Subcults','SoundHash','Patchwork','SubCorp','Clustr','Discord Spy','Transcript','Internet-ID','Galdr','Jury-Rigged','Cutroom','Portfolio'];
const data=[298423,135047,68915,66871,64437,55826,47696,43424,32395,32715,19521,16107,4737];
const colors=[D.purple,D.green,D.pink,D.cyan,D.orange,D.red,D.yellow,D.purple,D.cyan,D.green,D.pink,D.orange,D.comment];
new Chart(document.getElementById('c'),{type:'bar',
  data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:0,barPercentage:0.7}]},
  options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
    plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw.toLocaleString()+' lines'}}},
    scales:{x:{grid:{color:'rgba(98,114,164,0.2)'},ticks:{callback:v=>(v/1000)+'k'}},y:{grid:{display:false}}}}
});
</script>
</body></html>
